name: native_vlc_player
description: Local, iOS-only native platform view wrapping MobileVLCKit's VLCMediaPlayer directly, bypassing flutter_vlc_player's Dart wrapper.
version: 0.0.1
publish_to: 'none'

environment:
  sdk: ^3.12.2
  flutter: ">=3.3.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    platforms:
      ios:
        pluginClass: NativeVlcPlayerPlugin
