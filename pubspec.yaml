name: genz
description: "A new Flutter project."
publish_to: 'none'
version: 1.3.7+53

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.2.0
  provider: ^6.1.1
  shared_preferences: ^2.2.2
  intl: ^0.20.2
  video_player: ^2.13.0
  native_vlc_player:
    path: native_vlc_player
  cached_network_image: ^3.3.1
  wakelock_plus: ^1.2.8
  screen_brightness: ^2.0.0+3
  volume_controller: ^3.6.0
  url_launcher: ^6.3.0
  path_provider: ^2.1.1
  hive_ce: ^2.19.3
  hive_ce_flutter: ^2.3.4
  crypto: ^3.0.7
  device_info_plus: ^13.2.0
  background_downloader: ^9.5.8
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  media_kit_libs_windows_video: ^1.0.11
  media_kit_libs_macos_video: ^1.1.4
  window_manager: ^0.5.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  # App Store rejects a 1024x1024 icon with transparency — flatten it onto
  # an opaque background instead of shipping the raw (alpha-having) source.
  remove_alpha_ios: true
  image_path: "icon.png"
  web:
    generate: true
    image_path: "icon.png"
  windows:
    generate: true
    image_path: "icon.png"
  macos:
    generate: true
    image_path: "icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    # Root CA for the sync backend's certificate. See
    # lib/services/backend_api_service.dart for why this has to ship with
    # the app instead of relying on the device's own trust store.
    - assets/certs/

  # Bundled rather than fetched at runtime by google_fonts. Three reasons:
  # a cold first launch showed the fallback face until the download finished,
  # which is exactly what an App Review reviewer sees; the fallback's metrics
  # differ from Archivo's, which silently changed the height of every text
  # row and overflowed the poster captions; and it removes a network
  # dependency from first paint.
  fonts:
    - family: Archivo
      fonts:
        # Variable: one file covers 100-900 plus the 62-125 width axis used
        # for dense channel rows. See AppType, which drives the wght axis
        # explicitly via fontVariations.
        - asset: assets/fonts/Archivo-Variable.ttf
    - family: IBMPlexSansArabic
      fonts:
        - asset: assets/fonts/IBMPlexSansArabic-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSansArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSansArabic-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSansArabic-Bold.ttf
          weight: 700
